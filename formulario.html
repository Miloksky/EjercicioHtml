<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El formulario</title>
</head>
<body>
    <form action="/submit">
        <h2>Información personal</h2>
        <label for="Nombre">Nombre</label>
        <input type="text" id = "Nombre" name = "Nombre" required>
        <br><br>
        <label for="Apellidos">Apellidos</label>
        <input type="text" id = "Apellidos" name = "Apellidos" required>
        <br><br>
        <label for="fechaDeNacimiento">Fecha de nacimiento</label>
        <input type="date" id = "fechaDeNacimiento" name = "fechaDeNacimiento" required>
        <br><br>
        <p >Género</p> 
        <label for="hombre">Hombre</label>
        <input type="radio"id ="hombre" name = "Genero" required>
        <label for="mujer">Mujer</label>
       <input type="radio" id = "mujer" name = "Genero"required>
       <h2>Informacion de contacto</h2>
        <label for="email">Email</label>
        <input type="email" id = "email" name = "email" required>
        <label for="phoneNumber">Teléfono</label>
        <input type="Number"id = "phoneNumber" name = "phoneNumber" required>
        <label for="direccion">Dirección</label>
        <input type="text" id = "direccion" name = "direccion" required>
        <h2>Informacion de cuenta</h2>
        <label for="user">Usuario</label>
        <input type="text" id = "user" name = "user" required>
        <label for="contraseña">contraseña</label>
        <input type="password" id = "contraseña" name = "contraseña" required>
        <label for="contraseña">Confirmación de contraseña</label>
        <input type="password" id = "contraseña" name = "contraseña" required>
        <h2>Preferencias</h2>
        <label for="color">Cual es tu color favorito?</label>
        <select id = "color" name "color" required >
            <option >verde</option>
            <option >negro</option>
            <option >azul</option>
            <option >amarillo</option>
        </select>
        <br>
        <br>

        <label for="terms">Aceptar terminos y condiciones</label>
        <input type="checkbox" id = "terms" name = "terms" required>
        <br><br>
        <label for="send"></label>
        <input type="submit" name="send" id="send">
        

    
    </form>
</body>
</html>
